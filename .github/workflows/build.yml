name: Build Android APK v2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create v2 project files
        run: |
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/java/com/my/screenblocker

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ScreenBlocker"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.my.screenblocker"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.my.screenblocker"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0"

                  ndk {
                      abiFilters += listOf("arm64-v8a", "armeabi-v7a")
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("com.google.android.gms:play-services-mlkit-face-detection:17.1.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="ScreenBlocker"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">

                  <meta-data
                      android:name="com.google.mlkit.vision.DEPENDENCIES"
                      android:value="face" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".BlurService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_card.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#1E293B" />
              <corners android:radius="20dp" />
              <stroke android:width="1dp" android:color="#334155" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_btn_start.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#10B981" />
              <corners android:radius="14dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_btn_stop.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#EF4444" />
              <corners android:radius="14dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0F172A"
              android:fillViewport="true">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="22dp">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="24dp"
                      android:text="ScreenBlocker"
                      android:textColor="#F8FAFC"
                      android:textSize="28sp"
                      android:textStyle="bold" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="4dp"
                      android:text="Smart Privacy Overlay • v2.0 Lite"
                      android:textColor="#94A3B8"
                      android:textSize="14sp" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="28dp"
                      android:background="@drawable/bg_card"
                      android:gravity="center"
                      android:orientation="vertical"
                      android:padding="24dp">

                      <TextView
                          android:id="@+id/tvStatus"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="● সার্ভিস বন্ধ আছে"
                          android:textColor="#94A3B8"
                          android:textSize="16sp"
                          android:textStyle="bold" />

                      <androidx.appcompat.widget.AppCompatButton
                          android:id="@+id/btnStart"
                          android:layout_width="match_parent"
                          android:layout_height="56dp"
                          android:layout_marginTop="20dp"
                          android:background="@drawable/bg_btn_start"
                          android:text="ব্লকার চালু করুন (ON)"
                          android:textAllCaps="false"
                          android:textColor="#FFFFFF"
                          android:textSize="16sp"
                          android:textStyle="bold" />

                      <androidx.appcompat.widget.AppCompatButton
                          android:id="@+id/btnStop"
                          android:layout_width="match_parent"
                          android:layout_height="56dp"
                          android:layout_marginTop="12dp"
                          android:background="@drawable/bg_btn_stop"
                          android:text="ব্লকার বন্ধ করুন (OFF)"
                          android:textAllCaps="false"
                          android:textColor="#FFFFFF"
                          android:textSize="16sp"
                          android:textStyle="bold" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="20dp"
                      android:background="@drawable/bg_card"
                      android:orientation="vertical"
                      android:padding="20dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="বক্সের সাইজ (কভারেজ)"
                          android:textColor="#E2E8F0"
                          android:textSize="15sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/tvPaddingValue"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
