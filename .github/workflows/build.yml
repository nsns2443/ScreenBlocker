          import android.os.Build
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService

          class BlockerTileService : TileService() {

              override fun onStartListening() {
                  super.onStartListening()
                  updateTileState()
              }

              override fun onClick() {
                  super.onClick()
                  if (BlurService.isRunning) {
                      val stopIntent = Intent(this, BlurService::class.java).apply {
                          action = BlurService.ACTION_STOP
                      }
                      startService(stopIntent)
                      qsTile?.apply {
                          state = Tile.STATE_INACTIVE
                          label = "ScreenBlocker"
                          updateTile()
                      }
                  } else {
                      val launchIntent = Intent(this, MainActivity::class.java).apply {
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          putExtra("AUTO_START", true)
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                          val pi = PendingIntent.getActivity(
                              this, 101, launchIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                          )
                          startActivityAndCollapse(pi)
                      } else {
                          @Suppress("DEPRECATION")
                          startActivityAndCollapse(launchIntent)
                      }
                  }
              }

              private fun updateTileState() {
                  qsTile?.apply {
                      state = if (BlurService.isRunning && !BlurService.isPaused) {
                          Tile.STATE_ACTIVE
                      } else {
                          Tile.STATE_INACTIVE
                      }
                      label = "ScreenBlocker"
                      updateTile()
                  }
              }
          }
