          cat << 'EOF' > app/src/main/java/com/my/screenblocker/MainActivity.kt
          package com.my.screenblocker

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.media.projection.MediaProjectionConfig
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.appcompat.widget.SwitchCompat
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {

              private lateinit var projectionManager: MediaProjectionManager
              private lateinit var tvStatus: TextView

              private val screenCaptureLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  if (result.resultCode == Activity.RESULT_OK && result.data != null) {
                      val serviceIntent = Intent(this, BlurService::class.java).apply {
                          putExtra("RESULT_CODE", result.resultCode)
                          putExtra("DATA", result.data)
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(serviceIntent)
                      } else {
                          startService(serviceIntent)
                      }
                      updateStatusUI(true)
                      Toast.makeText(this, "ScreenBlocker started", Toast.LENGTH_SHORT).show()
                      moveTaskToBack(true)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  projectionManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  tvStatus = findViewById(R.id.tvStatus)

                  requestNotificationPermissionIfNeeded()

                  val switchWomenOnly = findViewById<SwitchCompat>(R.id.switchWomenOnly)
                  switchWomenOnly.isChecked = BlurService.womenOnlyMode
                  switchWomenOnly.setOnCheckedChangeListener { _, isChecked ->
                      BlurService.womenOnlyMode = isChecked
                  }

                  val switchSolidBlack = findViewById<SwitchCompat>(R.id.switchSolidBlack)
                  switchSolidBlack.isChecked = BlurService.solidBlackMode
                  switchSolidBlack.setOnCheckedChangeListener { _, isChecked ->
                      BlurService.solidBlackMode = isChecked
                  }

                  val seekCoverage = findViewById<SeekBar>(R.id.seekCoverage)
                  val tvCoverageValue = findViewById<TextView>(R.id.tvCoverageValue)
                  seekCoverage.progress = (BlurService.bodyExtensionFactor * 10).toInt()
                  tvCoverageValue.text = "Downward Extension: ${BlurService.bodyExtensionFactor}x face height"

                  seekCoverage.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                          val factor = (progress.coerceAtLeast(5)) / 10.0f
                          BlurService.bodyExtensionFactor = factor
                          tvCoverageValue.text = "Downward Extension: ${factor}x face height"
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {}
                  })

                  val seekBlur = findViewById<SeekBar>(R.id.seekBlur)
                  val tvBlurValue = findViewById<TextView>(R.id.tvBlurValue)
                  seekBlur.progress = BlurService.blurStrength
                  updateBlurLabel(tvBlurValue, BlurService.blurStrength)

                  seekBlur.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                          val level = progress.coerceAtLeast(1)
                          BlurService.blurStrength = level
                          updateBlurLabel(tvBlurValue, level)
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {}
                  })

                  findViewById<Button>(R.id.btnStart).setOnClickListener {
                      startBlockerFlow()
                  }

                  findViewById<Button>(R.id.btnStop).setOnClickListener {
                      stopService(Intent(this, BlurService::class.java))
                      updateStatusUI(false)
                      Toast.makeText(this, "ScreenBlocker stopped", Toast.LENGTH_SHORT).show()
                  }

                  if (intent?.getBooleanExtra("AUTO_START", false) == true) {
                      intent.removeExtra("AUTO_START")
                      startBlockerFlow()
                  }
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  if (intent.getBooleanExtra("AUTO_START", false)) {
                      intent.removeExtra("AUTO_START")
                      startBlockerFlow()
                  }
              }

              private fun requestNotificationPermissionIfNeeded() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED
                      ) {
                          ActivityCompat.requestPermissions(
                              this, arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1001
                          )
                      }
                  }
              }

              private fun startBlockerFlow() {
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "Please allow 'Display over other apps' permission", Toast.LENGTH_LONG).show()
                      val intent = Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName")
                      )
                      startActivity(intent)
                  } else {
                      val captureIntent = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                          projectionManager.createScreenCaptureIntent(
                              MediaProjectionConfig.createConfigForDefaultDisplay()
                          )
                      } else {
                          projectionManager.createScreenCaptureIntent()
                      }
                      screenCaptureLauncher.launch(captureIntent)
                  }
              }

              private fun updateBlurLabel(tv: TextView, level: Int) {
                  val label = when {
                      level <= 3 -> "Fine"
                      level <= 6 -> "Medium"
                      else -> "Heavy"
                  }
                  tv.text = "Pixel Size: $label (Level $level)"
              }

              override fun onResume() {
                  super.onResume()
                  updateStatusUI(BlurService.isRunning)
              }

              private fun updateStatusUI(active: Boolean) {
                  if (active) {
                      tvStatus.text = if (BlurService.isPaused) "● Service Paused" else "● Service Active"
                      tvStatus.setTextColor(
                          Color.parseColor(if (BlurService.isPaused) "#F59E0B" else "#10B981")
                      )
                  } else {
                      tvStatus.text = "● Service Stopped"
                      tvStatus.setTextColor(Color.parseColor("#94A3B8"))
                  }
              }
          }
