          cat << 'EOF' > app/src/main/java/com/my/screenblocker/BlurService.kt
          package com.my.screenblocker

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.*
          import android.util.DisplayMetrics
          import android.view.Gravity
          import android.view.WindowManager
          import androidx.core.app.NotificationCompat
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.face.FaceDetection
          import com.google.mlkit.vision.face.FaceDetectorOptions
          import kotlin.math.abs

          class BlurService : Service() {

              companion object {
                  var isRunning = false
                  var womenOnlyMode = true
                  var bodyExtensionFactor = 2.2f // Extends from face down to chest/breast area
                  var blurStrength = 8           // 1 (light) to 10 (heavy frosted blur)
              }

              private var mediaProjection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var imageReader: ImageReader? = null
              private lateinit var windowManager: WindowManager
              private lateinit var overlayView: OverlayView
              private lateinit var genderClassifier: GenderClassifier

              private var lastProcessTime = 0L
              private var isProcessing = false
              private var lastSamplePixels: IntArray? = null
              private var currentPatches: List<BlurPatch> = emptyList()

              private var realWidth = 1080
              private var realHeight = 2400

              private val handler = Handler(Looper.getMainLooper())

              private val detector = FaceDetection.getClient(
                  FaceDetectorOptions.Builder()
                      .setPerformanceMode(FaceDetectorOptions.PERFORMANCE_MODE_FAST)
                      .setMinFaceSize(0.06f)
                      .build()
              )

              private fun getRealScreenSize(): Pair<Int, Int> {
                  return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      val bounds = windowManager.maximumWindowMetrics.bounds
                      Pair(bounds.width(), bounds.height())
                  } else {
                      val metrics = DisplayMetrics()
                      @Suppress("DEPRECATION")
                      windowManager.defaultDisplay.getRealMetrics(metrics)
                      Pair(metrics.widthPixels, metrics.heightPixels)
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  isRunning = true
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  genderClassifier = GenderClassifier(this)

                  val (w, h) = getRealScreenSize()
                  realWidth = w
                  realHeight = h

                  overlayView = OverlayView(this)

                  val params = WindowManager.LayoutParams(
                      realWidth,
                      realHeight,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 0
                      y = 0
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                      }
                  }
                  windowManager.addView(overlayView, params)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startForegroundNotification()

                  val resultCode = intent?.getIntExtra("RESULT_CODE", Activity.RESULT_CANCELED) ?: return START_NOT_STICKY
                  val data = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      intent.getParcelableExtra("DATA", Intent::class.java)
                  } else {
                      @Suppress("DEPRECATION")
                      intent.getParcelableExtra("DATA")
                  } ?: return START_NOT_STICKY

                  val projectionManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  mediaProjection = projectionManager.getMediaProjection(resultCode, data)

                  mediaProjection?.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() {
                          stopSelf()
                      }
                  }, handler)
                  startScreenCapture()

                  return START_STICKY
              }

              private fun startForegroundNotification() {
                  val channelId = "blocker_channel"
                  val channel = NotificationChannel(channelId, "ScreenBlocker Service", NotificationManager.IMPORTANCE_LOW)
                  getSystemService(NotificationManager::class.java).createNotificationChannel(channel)

                  val openIntent = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE
                  )

                  val notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("ScreenBlocker Active")
                      .setContentText("Tap here to open settings or stop")
                      .setSmallIcon(android.R.drawable.ic_lock_idle_lock)
                      .setContentIntent(openIntent)
                      .setOngoing(true)
                      .build()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(1, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(1, notification)
                  }
              }

              private fun hasScreenChanged(bitmap: Bitmap, scaleX: Float, scaleY: Float): Boolean {
                  val cols = 5
                  val rows = 8
                  val newSamples = IntArray(cols * rows)
                  var idx = 0
                  var diffSum = 0L
                  var comparedCount = 0
                  val prev = lastSamplePixels

                  for (r in 1..rows) {
                      val y = (bitmap.height * r) / (rows + 1)
                      for (c in 1..cols) {
                          val x = (bitmap.width * c) / (cols + 1)
                          val pixel = bitmap.getPixel(x, y)
                          newSamples[idx] = pixel

                          val screenX = (x * scaleX).toInt()
                          val screenY = (y * scaleY).toInt()
                          val insideBox = currentPatches.any { it.screenRect.contains(screenX, screenY) }

                          if (!insideBox && prev != null) {
                              val p1 = prev[idx]
                              val dr = abs(((pixel shr 16) and 0xFF) - ((p1 shr 16) and 0xFF))
                              val dg = abs(((pixel shr 8) and 0xFF) - ((p1 shr 8) and 0xFF))
                              val db = abs((pixel and 0xFF) - (p1 and 0xFF))
                              diffSum += (dr + dg + db) / 3
                              comparedCount++
                          }
                          idx++
                      }
                  }
                  lastSamplePixels = newSamples
                  if (prev == null || comparedCount == 0) return true
                  return (diffSum / comparedCount) > 12
              }

              private fun createBlurredPatchBitmap(source: Bitmap, region: Rect): Bitmap? {
                  val left = region.left.coerceIn(0, source.width - 1)
                  val top = region.top.coerceIn(0, source.height - 1)
                  val right = region.right.coerceIn(left + 1, source.width)
                  val bottom = region.bottom.coerceIn(top + 1, source.height)

                  val w = right - left
                  val h = bottom - top
                  if (w < 8 || h < 8) return null

                  val crop = Bitmap.createBitmap(source, left, top, w, h)

                  // Higher blurStrength = smaller intermediate resolution = smoother, heavier blur
                  val divisor = (blurStrength * 2.4f + 4f).coerceAtLeast(6f)
                  val smallW = (w / divisor).toInt().coerceIn(5, 24)
                  val smallH = (h / divisor).toInt().coerceIn(6, 32)

                  val tiny = Bitmap.createScaledBitmap(crop, smallW, smallH, true)
                  crop.recycle()

                  // Smooth 3x3 average pass on the tiny bitmap for creamy Gaussian-like blur
                  val blurred = smoothTinyBitmap(tiny)
                  tiny.recycle()
                  return blurred
              }

              private fun smoothTinyBitmap(src: Bitmap): Bitmap {
                  val w = src.width
                  val h = src.height
                  val out = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  val pixels = IntArray(w * h)
                  src.getPixels(pixels, 0, w, 0, 0, w, h)
                  val result = IntArray(w * h)

                  for (y in 0 until h) {
                      for (x in 0 until w) {
                          var rSum = 0
                          var gSum = 0
                          var bSum = 0
                          var count = 0
                          for (dy in -1..1) {
                              val ny = (y + dy).coerceIn(0, h - 1)
                              for (dx in -1..1) {
                                  val nx = (x + dx).coerceIn(0, w - 1)
                                  val p = pixels[ny * w + nx]
                                  rSum += (p shr 16) and 0xFF
                                  gSum += (p shr 8) and 0xFF
                                  bSum += p and 0xFF
                                  count++
                              }
                          }
                          result[y * w + x] = (0xFF shl 24) or ((rSum / count) shl 16) or ((gSum / count) shl 8) or (bSum / count)
                      }
                  }
                  out.setPixels(result, 0, w, 0, 0, w, h)
                  return out
              }

              private fun startScreenCapture() {
                  val captureWidth = (realWidth / 2).coerceAtLeast(360)
                  val captureHeight = (realHeight / 2).coerceAtLeast(640)
                  val density = (resources.displayMetrics.densityDpi / 2).coerceAtLeast(160)

                  val scaleX = realWidth.toFloat() / captureWidth.toFloat()
                  val scaleY = realHeight.toFloat() / captureHeight.toFloat()

                  imageReader = ImageReader.newInstance(captureWidth, captureHeight, PixelFormat.RGBA_8888, 2)
                  virtualDisplay = mediaProjection?.createVirtualDisplay(
                      "ScreenBlockerDisplay", captureWidth, captureHeight, density,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                      imageReader?.surface, null, handler
                  )

                  imageReader?.setOnImageAvailableListener({ reader ->
                      val image = reader.acquireLatestImage() ?: return@setOnImageAvailableListener
                      val now = System.currentTimeMillis()

                      if (isProcessing || now - lastProcessTime < 150) {
                          image.close()
                          return@setOnImageAvailableListener
                      }
                      lastProcessTime = now
                      isProcessing = true

                      val planes = image.planes
                      val buffer = planes[0].buffer
                      val pixelStride = planes[0].pixelStride
                      val rowStride = planes[0].rowStride
                      val rowPadding = rowStride - pixelStride * captureWidth

                      val fullBitmap = Bitmap.createBitmap(
                          captureWidth + rowPadding / pixelStride, captureHeight, Bitmap.Config.ARGB_8888
                      )
                      fullBitmap.copyPixelsFromBuffer(buffer)
                      image.close()

                      val bitmap = if (rowPadding > 0) {
                          val cropped = Bitmap.createBitmap(fullBitmap, 0, 0, captureWidth, captureHeight)
                          fullBitmap.recycle()
                          cropped
                      } else {
                          fullBitmap
                      }

                      val screenChanged = hasScreenChanged(bitmap, scaleX, scaleY)

                      if (!screenChanged && currentPatches.isNotEmpty()) {
                          bitmap.recycle()
                          isProcessing = false
                          return@setOnImageAvailableListener
                      }

                      val inputImage = InputImage.fromBitmap(bitmap, 0)
                      detector.process(inputImage)
                          .addOnSuccessListener { faces ->
                              val newPatches = mutableListOf<BlurPatch>()
                              for (face in faces) {
                                  val fb = face.boundingBox

                                  val shouldBlur = if (womenOnlyMode) {
                                      genderClassifier.isFemale(bitmap, fb)
                                  } else {
                                      true
                                  }

                                  if (shouldBlur) {
                                      val fw = fb.width()
                                      val fh = fb.height()

                                      // Expand from face to cover hair, shoulders, and chest/breast area
                                      val expandedCapRect = Rect(
                                          (fb.left - fw * 0.70f).toInt().coerceAtLeast(0),
                                          (fb.top - fh * 0.35f).toInt().coerceAtLeast(0),
                                          (fb.right + fw * 0.70f).toInt().coerceAtMost(captureWidth),
                                          (fb.bottom + fh * bodyExtensionFactor).toInt().coerceAtMost(captureHeight)
                                      )

                                      val blurBmp = createBlurredPatchBitmap(bitmap, expandedCapRect)
                                      if (blurBmp != null) {
                                          val screenRect = Rect(
                                              (expandedCapRect.left * scaleX).toInt(),
                                              (expandedCapRect.top * scaleY).toInt(),
                                              (expandedCapRect.right * scaleX).toInt(),
                                              (expandedCapRect.bottom * scaleY).toInt()
                                          )
                                          newPatches.add(BlurPatch(screenRect, blurBmp))
                                      }
                                  }
                              }

                              if (screenChanged) {
                                  currentPatches = newPatches
                              } else if (newPatches.isNotEmpty()) {
                                  currentPatches = currentPatches + newPatches
                              }
                              overlayView.updatePatches(currentPatches)
                          }
                          .addOnCompleteListener {
                              bitmap.recycle()
                              isProcessing = false
                          }
                  }, handler)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  isRunning = false
                  virtualDisplay?.release()
                  imageReader?.close()
                  mediaProjection?.stop()
                  if (::genderClassifier.isInitialized) {
                      genderClassifier.close()
                  }
                  if (::overlayView.isInitialized) {
                      windowManager.removeView(overlayView)
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/my/screenblocker/MainActivity.kt
          package com.my.screenblocker

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.appcompat.widget.SwitchCompat

          class MainActivity : AppCompatActivity() {

              private lateinit var projectionManager: MediaProjectionManager
              private lateinit var tvStatus: TextView

              private val screenCaptureLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  if (result.resultCode == Activity.RESULT_OK && result.data != null) {
                      val serviceIntent = Intent(this, BlurService::class.java).apply {
                          putExtra("RESULT_CODE", result.resultCode)
                          putExtra("DATA", result.data)
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(serviceIntent)
                      } else {
                          startService(serviceIntent)
                      }
                      updateStatusUI(true)
                      Toast.makeText(this, "ScreenBlocker started", Toast.LENGTH_SHORT).show()
                      moveTaskToBack(true)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  projectionManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  tvStatus = findViewById(R.id.tvStatus)

                  val switchWomenOnly = findViewById<SwitchCompat>(R.id.switchWomenOnly)
                  switchWomenOnly.isChecked = BlurService.womenOnlyMode
                  switchWomenOnly.setOnCheckedChangeListener { _, isChecked ->
                      BlurService.womenOnlyMode = isChecked
                  }

                  val seekCoverage = findViewById<SeekBar>(R.id.seekCoverage)
                  val tvCoverageValue = findViewById<TextView>(R.id.tvCoverageValue)
                  seekCoverage.progress = (BlurService.bodyExtensionFactor * 10).toInt()
                  tvCoverageValue.text = "Downward Extension: ${BlurService.bodyExtensionFactor}x face height"

                  seekCoverage.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                          val factor = (progress.coerceAtLeast(5)) / 10.0f
                          BlurService.bodyExtensionFactor = factor
                          tvCoverageValue.text = "Downward Extension: ${factor}x face height"
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {}
                  })

                  val seekBlur = findViewById<SeekBar>(R.id.seekBlur)
                  val tvBlurValue = findViewById<TextView>(R.id.tvBlurValue)
                  seekBlur.progress = BlurService.blurStrength
                  updateBlurLabel(tvBlurValue, BlurService.blurStrength)

                  seekBlur.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                          val level = progress.coerceAtLeast(1)
                          BlurService.blurStrength = level
                          updateBlurLabel(tvBlurValue, level)
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {}
                  })

                  findViewById<Button>(R.id.btnStart).setOnClickListener {
                      if (!Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "Please allow 'Display over other apps' permission", Toast.LENGTH_LONG).show()
                          val intent = Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")
                          )
                          startActivity(intent)
                      } else {
                          screenCaptureLauncher.launch(projectionManager.createScreenCaptureIntent())
                      }
                  }

                  findViewById<Button>(R.id.btnStop).setOnClickListener {
                      stopService(Intent(this, BlurService::class.java))
                      updateStatusUI(false)
                      Toast.makeText(this, "ScreenBlocker stopped", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun updateBlurLabel(tv: TextView, level: Int) {
                  val label = when {
                      level <= 3 -> "Light"
                      level <= 6 -> "Medium"
                      else -> "Heavy"
                  }
                  tv.text = "Strength: $label (Level $level)"
              }

              override fun onResume() {
                  super.onResume()
                  updateStatusUI(BlurService.isRunning)
              }

              private fun updateStatusUI(active: Boolean) {
                  if (active) {
                      tvStatus.text = "● Service Active"
                      tvStatus.setTextColor(Color.parseColor("#10B981"))
                  } else {
                      tvStatus.text = "● Service Stopped"
                      tvStatus.setTextColor(Color.parseColor("#94A3B8"))
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
