name: Build Android APK v6

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create v6 project files with true OPAQUE windows
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/java/com/my/screenblocker

          echo "Downloading lightweight offline Gender Classification model..."
          curl -fSL --connect-timeout 15 --max-time 60 "https://raw.githubusercontent.com/shubham0204/Age-Gender_Estimation_TF-Android/master/app/src/main/assets/model_gender_q.tflite" -o app/src/main/assets/gender_model.tflite \
          || curl -fSL --connect-timeout 15 --max-time 60 "https://raw.githubusercontent.com/shubham0204/Age-Gender_Estimation_TF-Android/master/app/src/main/assets/model_lite_gender_q.tflite" -o app/src/main/assets/gender_model.tflite \
          || curl -fSL --connect-timeout 15 --max-time 60 "https://raw.githubusercontent.com/haturusinghe/cnn-age-gender-detection-android/main/app/src/main/assets/model_gender_nonq.tflite" -o app/src/main/assets/gender_model.tflite

          ls -lh app/src/main/assets/gender_model.tflite

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ScreenBlocker"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

