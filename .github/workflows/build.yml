          package com.my.screenblocker

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Rect
          import org.tensorflow.lite.Interpreter
          import java.io.FileInputStream
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.nio.MappedByteBuffer
          import java.nio.channels.FileChannel

          class GenderClassifier(context: Context) {
              private var interpreter: Interpreter? = null
              private val inputSize = 128

              init {
                  try {
                      val model = loadModelFile(context, "gender_model.tflite")
                      val options = Interpreter.Options().apply {
                          setNumThreads(2)
                      }
                      interpreter = Interpreter(model, options)
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun loadModelFile(context: Context, filename: String): MappedByteBuffer {
                  val fd = context.assets.openFd(filename)
                  val inputStream = FileInputStream(fd.fileDescriptor)
                  val fileChannel = inputStream.channel
                  return fileChannel.map(FileChannel.MapMode.READ_ONLY, fd.startOffset, fd.declaredLength)
              }

              fun isFemale(screenBitmap: Bitmap, faceRect: Rect): Boolean {
                  val tflite = interpreter ?: return true

                  val padX = (faceRect.width() * 0.20f).toInt()
                  val padY = (faceRect.height() * 0.20f).toInt()

                  val left = (faceRect.left - padX).coerceIn(0, screenBitmap.width - 1)
                  val top = (faceRect.top - padY).coerceIn(0, screenBitmap.height - 1)
                  val right = (faceRect.right + padX).coerceIn(left + 1, screenBitmap.width)
                  val bottom = (faceRect.bottom + padY).coerceIn(top + 1, screenBitmap.height)

                  val cropW = right - left
                  val cropH = bottom - top
                  if (cropW < 12 || cropH < 12) return false

                  var cropped: Bitmap? = null
                  var scaled: Bitmap? = null
                  return try {
                      cropped = Bitmap.createBitmap(screenBitmap, left, top, cropW, cropH)
                      scaled = Bitmap.createScaledBitmap(cropped, inputSize, inputSize, true)

                      val inputBuffer = ByteBuffer.allocateDirect(4 * inputSize * inputSize * 3)
                      inputBuffer.order(ByteOrder.nativeOrder())

                      val pixels = IntArray(inputSize * inputSize)
                      scaled.getPixels(pixels, 0, inputSize, 0, 0, inputSize, inputSize)

                      for (pixel in pixels) {
                          val r = ((pixel shr 16) and 0xFF) / 255.0f
                          val g = ((pixel shr 8) and 0xFF) / 255.0f
                          val b = (pixel and 0xFF) / 255.0f
                          inputBuffer.putFloat(r)
                          inputBuffer.putFloat(g)
                          inputBuffer.putFloat(b)
                      }

                      val output = Array(1) { FloatArray(2) }
                      tflite.run(inputBuffer, output)

                      val maleProb = output[0][0]
                      val femaleProb = output[0][1]
                      femaleProb >= 0.52f && femaleProb > maleProb
                  } catch (e: Exception) {
                      false
                  } finally {
                      scaled?.recycle()
                      cropped?.recycle()
                  }
              }

              fun close() {
                  interpreter?.close()
                  interpreter = null
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/my/screenblocker/MosaicBoxView.kt
          package com.my.screenblocker

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Rect
          import android.view.View

          data class BlurPatch(
              val screenRect: Rect,
              val mosaicBitmap: Bitmap
          )

          class MosaicBoxView(context: Context) : View(context) {
              private var mosaicBitmap: Bitmap? = null
              private var solidBlackMode: Boolean = false

              private val blackPaint = Paint().apply {
                  color = Color.parseColor("#0B0F19")
                  style = Paint.Style.FILL
              }

              private val mosaicPaint = Paint().apply {
                  isAntiAlias = false
                  isFilterBitmap = false
                  isDither = false
                  alpha = 255
              }

              private val destRect = Rect()

              init {
                  setBackgroundColor(Color.parseColor("#0B0F19"))
              }

              fun setContent(bitmap: Bitmap?, useSolidBlack: Boolean) {
                  mosaicBitmap = bitmap
                  solidBlackMode = useSolidBlack
                  invalidate()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  destRect.set(0, 0, width, height)
                  canvas.drawRect(destRect, blackPaint)
                  if (!solidBlackMode) {
                      val bmp = mosaicBitmap
                      if (bmp != null && !bmp.isRecycled) {
                          canvas.drawBitmap(bmp, null, destRect, mosaicPaint)
                      }
                  }
              }
          }
