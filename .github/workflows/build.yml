name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create all project files automatically
        run: |
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/java/com/my/screenblocker

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ScreenBlocker"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.my.screenblocker"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.my.screenblocker"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("com.google.mlkit:face-detection:16.1.7")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="ScreenBlocker"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MaterialComponents.DayNight.DarkActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".BlurService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:gravity="center"
              android:orientation="vertical"
              android:padding="24dp">

              <Button
                  android:id="@+id/btnStart"
                  android:layout_width="match_parent"
                  android:layout_height="60dp"
                  android:text="ব্লকার চালু করুন (ON)"
                  android:textSize="18sp" />

              <Button
                  android:id="@+id/btnStop"
                  android:layout_width="match_parent"
                  android:layout_height="60dp"
                  android:layout_marginTop="16dp"
                  android:text="ব্লকার বন্ধ করুন (OFF)"
                  android:textSize="18sp" />
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/my/screenblocker/OverlayView.kt
          package com.my.screenblocker

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Rect
          import android.view.View

          class OverlayView(context: Context) : View(context) {
              private var boxes: List<Rect> = emptyList()
              private val paint = Paint().apply {
                  color = Color.BLACK
                  style = Paint.Style.FILL
              }

              fun updateBoxes(newBoxes: List<Rect>) {
                  boxes = newBoxes
                  invalidate()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  for (rect in boxes) {
                      canvas.drawRect(
                          (rect.left - 30).toFloat(),
                          (rect.top - 40).toFloat(),
                          (rect.right + 30).toFloat(),
                          (rect.bottom + 40).toFloat(),
                          paint
                      )
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/my/screenblocker/BlurService.kt
          package com.my.screenblocker

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.*
          import android.view.WindowManager
          import androidx.core.app.NotificationCompat
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.face.FaceDetection
          import com.google.mlkit.vision.face.FaceDetectorOptions

          class BlurService : Service() {

              private var mediaProjection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var imageReader: ImageReader? = null
              private lateinit var windowManager: WindowManager
              private lateinit var overlayView: OverlayView

              private var lastProcessTime = 0L
              private val handler = Handler(Looper.getMainLooper())

              private val detector = FaceDetection.getClient(
                  FaceDetectorOptions.Builder()
                      .setPerformanceMode(FaceDetectorOptions.PERFORMANCE_MODE_FAST)
                      .build()
              )

              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  overlayView = OverlayView(this)

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  windowManager.addView(overlayView, params)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startForegroundNotification()

                  val resultCode = intent?.getIntExtra("RESULT_CODE", Activity.RESULT_CANCELED) ?: return START_NOT_STICKY
                  val data = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      intent.getParcelableExtra("DATA", Intent::class.java)
                  } else {
                      @Suppress("DEPRECATION")
                      intent.getParcelableExtra("DATA")
                  } ?: return START_NOT_STICKY

                  val projectionManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  mediaProjection = projectionManager.getMediaProjection(resultCode, data)

                  mediaProjection?.registerCallback(object : MediaProjection.Callback() {}, handler)
                  startScreenCapture()

                  return START_STICKY
              }

              private fun startForegroundNotification() {
                  val channelId = "blocker_channel"
                  val channel = NotificationChannel(channelId, "Screen Blocker", NotificationManager.IMPORTANCE_LOW)
                  getSystemService(NotificationManager::class.java).createNotificationChannel(channel)

                  val notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("Screen Blocker চালু আছে")
                      .setContentText("স্ক্রিন ফিল্টারিং চলছে...")
                      .setSmallIcon(android.R.drawable.ic_lock_idle_lock)
                      .build()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(1, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(1, notification)
                  }
              }

              private fun startScreenCapture() {
                  val metrics = resources.displayMetrics
                  val width = metrics.widthPixels
                  val height = metrics.heightPixels
                  val density = metrics.densityDpi

                  imageReader = ImageReader.newInstance(width, height, PixelFormat.RGBA_8888, 2)
                  virtualDisplay = mediaProjection?.createVirtualDisplay(
                      "ScreenBlockerDisplay", width, height, density,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                      imageReader?.surface, null, handler
                  )

                  imageReader?.setOnImageAvailableListener({ reader ->
                      val image = reader.acquireLatestImage() ?: return@setOnImageAvailableListener
                      val now = System.currentTimeMillis()

                      if (now - lastProcessTime < 400) {
                          image.close()
                          return@setOnImageAvailableListener
                      }
                      lastProcessTime = now

                      val planes = image.planes
                      val buffer = planes[0].buffer
                      val pixelStride = planes[0].pixelStride
                      val rowStride = planes[0].rowStride
                      val rowPadding = rowStride - pixelStride * width

                      val bitmap = Bitmap.createBitmap(
                          width + rowPadding / pixelStride, height, Bitmap.Config.ARGB_8888
                      )
                      bitmap.copyPixelsFromBuffer(buffer)
                      image.close()

                      val inputImage = InputImage.fromBitmap(bitmap, 0)
                      detector.process(inputImage)
                          .addOnSuccessListener { faces ->
                              val boxes = faces.map { it.boundingBox }
                              overlayView.updateBoxes(boxes)
                          }
                          .addOnCompleteListener {
                              bitmap.recycle()
                          }
                  }, handler)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  virtualDisplay?.release()
                  imageReader?.close()
                  mediaProjection?.stop()
                  if (::overlayView.isInitialized) {
                      windowManager.removeView(overlayView)
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/my/screenblocker/MainActivity.kt
          package com.my.screenblocker

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var projectionManager: MediaProjectionManager

              private val screenCaptureLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  if (result.resultCode == Activity.RESULT_OK && result.data != null) {
                      val serviceIntent = Intent(this, BlurService::class.java).apply {
                          putExtra("RESULT_CODE", result.resultCode)
                          putExtra("DATA", result.data)
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(serviceIntent)
                      } else {
                          startService(serviceIntent)
                      }
                      Toast.makeText(this, "ব্লকার চালু হয়েছে!", Toast.LENGTH_SHORT).show()
                      moveTaskToBack(true)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  projectionManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager

                  findViewById<Button>(R.id.btnStart).setOnClickListener {
                      if (!Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "আগে Display over other apps পারমিশন দিন", Toast.LENGTH_LONG).show()
                          val intent = Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")
                          )
                          startActivity(intent)
                      } else {
                          screenCaptureLauncher.launch(projectionManager.createScreenCaptureIntent())
                      }
                  }

                  findViewById<Button>(R.id.btnStop).setOnClickListener {
                      stopService(Intent(this, BlurService::class.java))
                      Toast.makeText(this, "ব্লকার বন্ধ করা হয়েছে", Toast.LENGTH_SHORT).show()
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenBlocker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
